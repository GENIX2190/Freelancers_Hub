<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="fh-session-expired" content="../users/session_expired.html">
    <title>Projects - Freelence Hub</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="css/view.css?v=3">
</head>
<body class="page-auth page-projects">

<header>
    <div class="header-container">
        <a href="../Main.html" class="logo-section">
            <div class="logo">FH</div>
            <div class="site-name">Freelence Hub</div>
        </a>
        <nav>
            <a href="../missions/candidature.html">💼 Missions</a>
            <a href="../formations/create.html">📚 Formations</a>
            <a href="../experience/view.html">✍️ Experience</a>
            <a href="view.html" class="active">📁 Projects</a>
            <a href="../users/login.html" class="nav-right">🔐 Login</a>
            <a href="../users/login.html?redirect=dashboard.html">📊 Dashboard</a>
        </nav>
    </div>
</header>

<div class="auth-fx" aria-hidden="true">
    <div class="auth-stars-layer auth-stars-layer--deep"></div>
    <div class="auth-stars-layer auth-stars-layer--mid"></div>
    <div class="auth-celestial">
        <div class="auth-earthshine"></div>
        <span class="auth-planet auth-planet-gas"></span>
        <span class="auth-planet auth-planet-rock"></span>
        <div class="auth-orbit">
            <span class="auth-orbit-dot"></span>
        </div>
        <div class="auth-star-bloom"></div>
    </div>
    <div class="auth-aurora"></div>
    <span class="meteor meteor-1"></span>
    <span class="meteor meteor-2"></span>
    <span class="meteor meteor-3"></span>
</div>

<div class="auth-lightning" aria-hidden="true"></div>
<div class="auth-lightning auth-lightning--b" aria-hidden="true"></div>

<div class="hero">
    <h1>📁 Projects</h1>
    <p>Browse ongoing projects and discover collaboration opportunities.</p>
</div>

<main>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Search projects..." oninput="filterProjects()">
    </div>

    <div class="projects-grid" id="projectsGrid"></div>
</main>

<footer>
    <p>© 2026 Freelence Hub — All rights reserved</p>
</footer>

<script src="../assets/js/common.js"></script>
<script src="js/view.js?v=2"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('header nav a, .sidebar-nav a, .side-nav a').forEach(function(link) {
        link.addEventListener('click', function(e) {
            var href = this.getAttribute('href');
            if (!href || href === '#' || href.startsWith('javascript:')) return;

            e.preventDefault();
            document.body.style.opacity = '0';
            document.body.style.transform = 'translateY(-10px)';

            setTimeout(function() {
                window.location.href = href;
            }, 300);
        });
    });
});
</script>

</body>
</html>
