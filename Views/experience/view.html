<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience &amp; Stories - Freelence Hub</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="css/view.css">
</head>
<body>

<header>
    <div class="header-container">
        <a href="../Main.html" class="logo-section">
            <div class="logo">FH</div>
            <div class="site-name">Freelence Hub</div>
        </a>
        <nav>
            <a href="../missions/candidature.html">💼 Missions</a>
            <a href="../formations/create.html">📚 Formations</a>
            <a href="view.html">✍️ Experience</a>
            <a href="../projets/view.html">📁 Projects</a>
            <a href="../users/login.html" class="nav-right">🔐 Login</a>
            <a href="../users/login.html?redirect=dashboard.html">📊 Dashboard</a>
        </nav>
    </div>
</header>

<!-- Side Nav -->


<div class="hero">
    <h1>✍️ Experience &amp; Stories</h1>
    <p>Read real freelancer stories, tips and tutorials — share your thoughts in the replies!</p>
</div>

<main>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Search posts by title, author or tag..." oninput="renderPosts()">
    </div>

    <div id="postsContainer"></div>
    <div class="empty-state" id="emptyState" style="display:none"><div class="icon">📝</div><p>No posts found.</p></div>
</main>

<footer>
    <p>© 2026 Freelence Hub — All rights reserved | Experience — Yassine Zaabi</p>
</footer>

<div class="toast" id="toast"></div>

<script src="../assets/js/common.js"></script>
<script src="js/view.js?v=2"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('header nav a, .sidebar-nav a, .side-nav a').forEach(function(link) {
        link.addEventListener('click', function(e) {
            var href = this.getAttribute('href');
            if (!href || href === '#' || href.startsWith('javascript:')) return;
            
            e.preventDefault();
            document.body.style.opacity = '0';
            document.body.style.transform = 'translateY(-10px)';
            
            setTimeout(function() {
                window.location.href = href;
            }, 300);
        });
    });
});
</script>

</body></html>
